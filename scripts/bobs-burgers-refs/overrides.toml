# Hand corrections for the Bob's Burgers watchlist.
#
# Applied by `python3 bobs_refs.py export`; they beat both the keyword guesses and TMDB.
# After editing:   python3 scripts/bobs-burgers-refs/bobs_refs.py export
# Titles are matched loosely (case, spaces and punctuation are ignored). Export prints a warning for
# any entry that didn't match anything, so typos don't fail silently.

# ── Types, everywhere a title appears ─────────────────────────────────────────────────────────
# movies / tv: show the title, labelled as that type.
# ignore:      never show it (in-show parody names, songs, games, people…).
#
# Stage shows and books: add a well-known screen adaptation with adapted_from and a note when
# there is one (see [S01E05]), otherwise ignore the reference.

movies = [
  "The Shining",
  "Sixteen Candles",   # S01E06, S11E04
  "Sabata",            # S01E09: 1969 spaghetti western
  "Star Wars",         # S02E02: "R2-D2 Hall" at Robot College
]

tv = [
  "Malcolm in the Middle",
  "The Love Boat",
  "Family Guy",        # S01E03
  "Friends",           # S02E04
]

ignore = [
  "Plump Friction",             # S01E06: a made-up title on the porn theater's marquee
  "Dong Day Afternoon",         # S01E06: same marquee (Dog Day Afternoon stays)
  "Pink Elephants On Parade",   # S01E08: a song/segment from Dumbo, which is listed itself
  "Family Gay",                 # S01E03: an episode of Family Guy, which is listed itself
  "ChalkZone",                  # S02E01: the wiki only says the plot is similar to one of its episodes
  "Hole In The Wall",           # S02E01: that ChalkZone episode
  "R2-D2 Hall",                 # S02E02: a hall name (Star Wars is listed)
  "The Return of the Revenge of Dr. Blowhole",  # S02E04: Emmy trivia, not a reference
  "The Penguins of Madagascar",                 # S02E04: same
  "Super Mario Bros",           # S02E04: studio trivia (an NES joke made for the episode)
  "Grand Theft Arlen",          # S02E04: shared sound effects, not a reference
  "Keep on Truckin'",           # S02E05: a cartoon drawing, not a show
  "R. Crumb",                   # S02E05: the cartoonist who drew it
  "Lollapalooza",               # S02E05: a music festival
  "Paddy's Pub: The Worst Bar in Philadelphia",  # S02E07: a similar plot, not a reference
  "Sasquatch",                  # S02E09: the creature
  "Get On Up",                  # S02E09: the show's parody name for Today, which is listed
]

# ── Per-episode fixes ─────────────────────────────────────────────────────────────────────────
# [SxxExx]
# add            = [{ title = "…", type = "movie" | "tv", year = 1984, must_watch = true, note = "…",
#                     adapted_from = "stage" | "book" }]
#                  (type defaults to "movie"; note replaces the "Added by hand." caption;
#                   adapted_from labels a screen adaptation of the work the episode references)
# remove         = ["…"]   drop a title from this episode only
# must_watch     = ["…"]   flag as must-watch
# not_must_watch = ["…"]   unflag

