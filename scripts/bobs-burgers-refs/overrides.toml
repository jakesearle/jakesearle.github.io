  { title = "Star Wars: Episode IV - A New Hope", year = 1977, note = "Chewbacca gets a mention (from IMDb Connections)." },
  { title = "Ghost Dad", year = 1990, note = "A girl at Louise's séance asks Bob if he's the ghost from Ghost Dad (from IMDb Connections)." },
  { title = "Ghost", year = 1990, note = "A girl at Louise's séance asks Bob if he's the ghost from Ghost (from IMDb Connections)." },
  { title = "Coyote Ugly", year = 2000, note = "Tina calls the women on the cover of Al's magazine \"the girls of Coyote Ugly\" (from IMDb Connections)." },
]

